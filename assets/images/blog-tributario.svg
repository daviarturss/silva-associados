<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" aria-hidden="true">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FAF5EC"/>
      <stop offset="1" stop-color="#EFE5D5"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#244A7E"/>
      <stop offset="1" stop-color="#0A1F44"/>
    </linearGradient>
    <linearGradient id="coin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E4C88F"/>
      <stop offset="1" stop-color="#B08F58"/>
    </linearGradient>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M50 0H0v50" fill="none" stroke="#0A1F44" stroke-opacity=".055" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <rect width="1200" height="800" fill="url(#grid)"/>
  <circle cx="1010" cy="170" r="230" fill="#0A1F44"/>
  <circle cx="1010" cy="170" r="260" fill="none" stroke="#C5A572" stroke-opacity=".5" stroke-width="2"/>
  <circle cx="1010" cy="170" r="170" fill="none" stroke="#C5A572" stroke-opacity=".22" stroke-width="2"/>

  <!-- símbolo de percentual -->
  <g stroke="#C5A572" stroke-width="18" stroke-linecap="round" fill="none">
    <circle cx="146" cy="168" r="38"/>
    <circle cx="294" cy="328" r="38"/>
    <path d="M312 132 128 364"/>
  </g>

  <!-- gráfico de barras -->
  <g>
    <rect x="250" y="546" width="86" height="106" rx="5" fill="url(#bar)" opacity=".55"/>
    <rect x="362" y="486" width="86" height="166" rx="5" fill="url(#bar)" opacity=".65"/>
    <rect x="474" y="516" width="86" height="136" rx="5" fill="url(#bar)" opacity=".6"/>
    <rect x="586" y="418" width="86" height="234" rx="5" fill="url(#bar)" opacity=".8"/>
    <rect x="698" y="362" width="86" height="290" rx="5" fill="url(#bar)"/>
    <rect x="810" y="298" width="86" height="354" rx="5" fill="url(#bar)"/>
    <rect x="922" y="230" width="86" height="422" rx="5" fill="url(#bar)"/>
  </g>

  <!-- linha de tendência -->
  <path d="M292 520 405 462 517 486 628 390 740 336 852 268 965 202" fill="none" stroke="#C5A572" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#FAF5EC" stroke="#C5A572" stroke-width="6">
    <circle cx="292" cy="520" r="11"/>
    <circle cx="405" cy="462" r="11"/>
    <circle cx="517" cy="486" r="11"/>
    <circle cx="628" cy="390" r="11"/>
    <circle cx="740" cy="336" r="11"/>
    <circle cx="852" cy="268" r="11"/>
    <circle cx="965" cy="202" r="11"/>
  </g>

  <!-- moedas -->
  <g>
    <ellipse cx="1024" cy="650" rx="78" ry="28" fill="#96713C"/>
    <ellipse cx="1024" cy="634" rx="78" ry="28" fill="url(#coin)"/>
    <ellipse cx="1024" cy="610" rx="78" ry="28" fill="#96713C"/>
    <ellipse cx="1024" cy="594" rx="78" ry="28" fill="url(#coin)"/>
    <ellipse cx="1024" cy="570" rx="78" ry="28" fill="#96713C"/>
    <ellipse cx="1024" cy="554" rx="78" ry="28" fill="url(#coin)"/>
    <path d="M1000 554h48M1012 538h24" stroke="#8A6A38" stroke-width="4" stroke-linecap="round" opacity=".65"/>
  </g>

  <path d="M250 700h790" stroke="#0A1F44" stroke-opacity=".16" stroke-width="2"/>
  <path d="M120 92h94M120 112h58" stroke="#8A6A38" stroke-width="3" stroke-linecap="round" opacity=".5"/>
