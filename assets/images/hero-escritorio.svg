  <!-- Linhas decorativas -->
  <path d="M40 88h64M40 100h40" stroke="#C5A572" stroke-width="2" stroke-linecap="round" opacity=".55"/>
  <circle cx="42" cy="128" r="3" fill="#C5A572"/>
</svg>
