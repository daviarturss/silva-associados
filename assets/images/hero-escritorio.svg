<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 840" width="720" height="840" role="img" aria-labelledby="title desc">
  <title id="title">Advogado em escritório moderno</title>
  <desc id="desc">Ilustração de um advogado de terno diante de uma janela em arco com vista urbana, mesa de madeira, livros e balança da justiça.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBF7F0"/>
      <stop offset="1" stop-color="#EDE4D5"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D9E7F3"/>
      <stop offset=".62" stop-color="#EDF4F8"/>
      <stop offset="1" stop-color="#FAFBF8"/>
    </linearGradient>
    <linearGradient id="suit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#18386B"/>
      <stop offset="1" stop-color="#0A1F44"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#96724F"/>
      <stop offset="1" stop-color="#6A4B33"/>
    </linearGradient>
    <radialGradient id="glow" cx=".78" cy=".18" r=".55">
      <stop offset="0" stop-color="#C5A572" stop-opacity=".22"/>
      <stop offset="1" stop-color="#C5A572" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="windowClip">
      <path d="M108 604V342a252 252 0 0 1 504 0v262Z"/>
    </clipPath>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#0A1F44" opacity=".045"/>
    </pattern>
  </defs>

  <!-- Fundo -->
  <rect width="720" height="840" fill="url(#bg)"/>
  <rect width="720" height="840" fill="url(#dots)"/>
  <rect width="720" height="840" fill="url(#glow)"/>
  <circle cx="628" cy="108" r="132" fill="#E7D9C0" opacity=".55"/>
  <circle cx="628" cy="108" r="132" fill="none" stroke="#C5A572" stroke-opacity=".35"/>
  <circle cx="54" cy="742" r="96" fill="none" stroke="#C5A572" stroke-opacity=".22"/>

  <!-- Janela em arco -->
  <path d="M96 604V340a264 264 0 0 1 528 0v264Z" fill="#FBF8F1" stroke="#C9B18A" stroke-width="3"/>
  <path d="M108 604V342a252 252 0 0 1 504 0v262Z" fill="url(#sky)"/>

  <g clip-path="url(#windowClip)">
    <circle cx="506" cy="232" r="52" fill="#E8CB95" opacity=".95"/>
    <circle cx="506" cy="232" r="66" fill="#E8CB95" opacity=".18"/>
    <ellipse cx="218" cy="196" rx="58" ry="18" fill="#FFFFFF" opacity=".55"/>
    <ellipse cx="256" cy="184" rx="38" ry="14" fill="#FFFFFF" opacity=".5"/>
    <ellipse cx="424" cy="270" rx="48" ry="14" fill="#FFFFFF" opacity=".45"/>

    <!-- Skyline distante -->
    <g fill="#94AAC4" opacity=".45">
      <rect x="100" y="420" width="58" height="184"/>
      <rect x="168" y="392" width="42" height="212"/>
      <rect x="220" y="438" width="52" height="166"/>
      <rect x="282" y="404" width="36" height="200"/>
      <rect x="328" y="450" width="62" height="154"/>
      <rect x="400" y="414" width="44" height="190"/>
      <rect x="454" y="380" width="58" height="224"/>
      <rect x="522" y="430" width="46" height="174"/>
      <rect x="578" y="396" width="54" height="208"/>
