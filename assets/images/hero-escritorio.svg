    <g stroke="#C5A572" stroke-width="2" fill="none" stroke-linecap="round">
      <path d="M575 614v66M546 690h58M530 614h90"/>
      <path d="M530 614 512 644M530 614l18 30M620 614l-18 30M620 614l18 30"/>
      <path d="M504 644h34c0 13-8 20-17 20s-17-7-17-20ZM602 644h36c0 13-8 20-18 20s-18-7-18-20Z" fill="#C5A572" fill-opacity=".14"/>
    </g>
    <circle cx="575" cy="608" r="6" fill="#C5A572"/>
    <rect x="565" y="686" width="20" height="5" rx="2" fill="#C5A572"/>
