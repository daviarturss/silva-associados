    <!-- óculos -->
    <rect x="322" y="409" width="32" height="21" rx="8" fill="#FFFFFF" fill-opacity=".08" stroke="#7A5A35" stroke-width="1.8"/>
    <rect x="366" y="409" width="32" height="21" rx="8" fill="#FFFFFF" fill-opacity=".08" stroke="#7A5A35" stroke-width="1.8"/>
    <path d="M354 418h12M322 416l-9-3M398 416l9-3" stroke="#7A5A35" stroke-width="1.8" stroke-linecap="round"/>
    <!-- nariz, boca -->
