    <path d="M328 404c6-3 12-3 18 0M374 404c6-3 12-3 18 0" stroke="#4B3A2F" stroke-width="2.6" stroke-linecap="round" fill="none"/>
    <circle cx="339" cy="417" r="2.4" fill="#2D2622"/>
