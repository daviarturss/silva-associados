    <path d="M349 446c7 5 15 5 22 0" stroke="#8D5540" stroke-width="2.4" stroke-linecap="round" fill="none"/>
    <path d="M346 459c9 3 19 3 28 0" stroke="#B67D56" stroke-width="1.4" stroke-linecap="round" fill="none" opacity=".6"/>
    <!-- paletó -->
    <path d="M238 710c4-100 58-162 122-162s118 62 122 162Z" fill="url(#suit)"/>
    <path d="M360 548 324 572l36 98 36-98Z" fill="#F7F4EC"/>
    <path d="M324 572 360 548l-18 74-37-28Z" fill="#0E2A55"/>
    <path d="M396 572 360 548l18 74 37-28Z" fill="#0E2A55"/>
    <!-- gravata -->
    <path d="M352 562h16l-3 12h-10Z" fill="#B08F58"/>
    <path d="M360 576 346 600l14 50 14-50Z" fill="#C5A572"/>
    <path d="M360 576v74" stroke="#A8874F" stroke-width="1.4" opacity=".7"/>
    <!-- lenço -->
    <path d="M410 646h22v13l-22 5Z" fill="#C5A572"/>
    <!-- botão -->
    <circle cx="360" cy="676" r="2.6" fill="#0A1F44" stroke="#C5A572" stroke-width="1"/>
  </g>

  <!-- Mesa -->
  <rect x="0" y="694" width="720" height="24" fill="url(#wood)"/>
  <rect x="0" y="694" width="720" height="3" fill="#C5A572" opacity=".55"/>
  <rect x="0" y="718" width="720" height="122" fill="#5E432E"/>
  <path d="M0 730h720" stroke="#C5A572" stroke-opacity=".18"/>
  <path d="M180 730v110M360 730v110M540 730v110" stroke="#4C3524" stroke-width="1.4"/>

  <!-- Objetos de mesa -->
  <g>
    <rect x="56" y="666" width="118" height="18" rx="2" fill="#C5A572"/>
    <rect x="64" y="648" width="104" height="18" rx="2" fill="#12305C"/>
    <rect x="60" y="632" width="88" height="16" rx="2" fill="#EEE4D4" stroke="#D5C3A6"/>
    <path d="M72 640h64M76 653h78M68 671h94" stroke="#F5F7FA" stroke-opacity=".45" stroke-width="2"/>

    <path d="M214 653h30v32c0 6-5 10-10 10h-10c-5 0-10-4-10-10Z" fill="#F5F1E8" stroke="#D6C7B0"/>
    <path d="M244 660h8c7 0 8 14 0 14h-8" fill="none" stroke="#D6C7B0" stroke-width="3"/>
    <path d="M220 646c-2-8 4-10 1-18M232 646c-2-8 4-10 1-18" stroke="#C9B18A" stroke-width="2" stroke-linecap="round" opacity=".7"/>

    <rect x="296" y="674" width="112" height="20" rx="2" fill="#F7F3EA" stroke="#DDD0BC"/>
    <path d="M308 681h76M308 687h56" stroke="#C9B18A" stroke-width="2" stroke-linecap="round"/>

