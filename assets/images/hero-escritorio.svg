  <path d="M360 90v514M108 486h504" stroke="#C9B18A" stroke-width="2.5" opacity=".85"/>
  <path d="M96 604V340a264 264 0 0 1 528 0v264" fill="none" stroke="#C5A572" stroke-width="2.5"/>

