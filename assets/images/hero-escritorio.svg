      <rect x="112" y="552" width="8" height="10"/><rect x="128" y="552" width="8" height="10"/>
      <rect x="196" y="470" width="9" height="11"/><rect x="214" y="470" width="9" height="11"/>
      <rect x="196" y="492" width="9" height="11"/><rect x="232" y="492" width="9" height="11"/>
      <rect x="200" y="538" width="9" height="11"/><rect x="222" y="538" width="9" height="11"/>
      <rect x="322" y="424" width="9" height="11"/><rect x="342" y="424" width="9" height="11"/>
      <rect x="322" y="450" width="9" height="11"/><rect x="360" y="450" width="9" height="11"/>
      <rect x="330" y="520" width="9" height="11"/><rect x="352" y="520" width="9" height="11"/>
      <rect x="436" y="472" width="8" height="10"/><rect x="454" y="472" width="8" height="10"/>
      <rect x="436" y="496" width="8" height="10"/><rect x="470" y="496" width="8" height="10"/>
      <rect x="546" y="444" width="9" height="11"/><rect x="566" y="444" width="9" height="11"/>
      <rect x="546" y="470" width="9" height="11"/><rect x="584" y="470" width="9" height="11"/>
    </g>

    <rect x="108" y="560" width="504" height="44" fill="#DDE7ED" opacity=".55"/>
    <path d="M132 126 92 610" stroke="#FFFFFF" stroke-width="26" opacity=".18"/>
    <path d="M172 126 132 610" stroke="#FFFFFF" stroke-width="8" opacity=".16"/>
  </g>

